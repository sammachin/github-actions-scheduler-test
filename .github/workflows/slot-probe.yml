permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append slot timing to log
        env:
          LOGFILE: logs/slot-probe.log
          SCHEDULED_CRON: ${{ github.event.schedule }}
          TRIGGER: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p logs
          ACTUAL="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          # Authoritative start time from the API (fall back to the step clock).
          RUN_STARTED_AT="$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" \
            | grep '"run_started_at"' | head -1 \
            | sed -E 's/.*"run_started_at": *"([^"]*)".*/\1/' || true)"
          RUN_STARTED_AT="${RUN_STARTED_AT:-$ACTUAL}"

          if [ "$TRIGGER" = "schedule" ] && [ -n "${SCHEDULED_CRON:-}" ]; then
            RSA_EPOCH="$(date -u -d "$RUN_STARTED_AT" +%s)"
            M="$(printf '%s' "$SCHEDULED_CRON" | awk '{print $1}')"
            H="$(printf '%s' "$SCHEDULED_CRON" | awk '{print $2}')"
            DAY="$(date -u -d "@$RSA_EPOCH" +%Y-%m-%d)"
            INT_EPOCH="$(date -u -d "$DAY $H:$M:00 UTC" +%s)"
            # If this slot's time today is after the start, it fired for yesterday.
            if [ "$INT_EPOCH" -gt "$RSA_EPOCH" ]; then INT_EPOCH=$((INT_EPOCH - 86400)); fi
            INTENDED="$(date -u -d "@$INT_EPOCH" '+%Y-%m-%dT%H:%M:%SZ')"
            DELAY=$((RSA_EPOCH - INT_EPOCH))
          else
            INTENDED="manual"; DELAY=0
          fi

          printf 'intended_utc=%s | run_started_at=%s | actual_run=%s | delay_sec=%s | schedule=%s | trigger=%s | run_id=%s\n' \
            "$INTENDED" "$RUN_STARTED_AT" "$ACTUAL" "$DELAY" "${SCHEDULED_CRON:-manual}" "$TRIGGER" "$RUN_ID" \
            >> "$LOGFILE"

      - name: Commit and push (with rebase retry)
        env:
          LOGFILE: logs/slot-probe.log
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$LOGFILE"
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "log(slot-probe): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "failed to push after retries" >&2
          exit 1
