name: slot-probe

# 288 distinct daily schedules, one per 5-minute slot (00:00 .. 23:55 UTC).
# Each run knows its own slot via github.event.schedule, so we can tell apart:
#   - ran on time / late  -> a log line whose delay_sec is small / large
